name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install linters
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y clang-format cppcheck
          else
            brew install clang-format cppcheck
          fi

      - name: Check (-Werror build, sanitized tests, format, lint)
        run: make check

      - name: Smoke test
        run: |
          make release
          ./build/release/neonpx --version
          ./build/release/neonpx --list --no-docker | head -20

  linux-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and test on musl
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.20 sh -c \
            'apk add --no-cache build-base >/dev/null && make test SAN=0 && make release STATIC=1'
          file build/release/neonpx
